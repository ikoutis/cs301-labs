<title>CS 301 — PageRank: graphs acting on data (meeting 16)</title>
<!--
  Self-contained interactive lecture deck, 1280 x 720, 2026-10-26.
  Follows the format of m16-svd.html. This HTML file is its own source.
  All examples are synthetic and computed from EDGES, never pasted scores.
  Convention throughout: column vectors; G[receiver][sender].
  G splits a sender's score uniformly among outgoing neighbors, and uses
  a uniform column for a sender without outgoing edges. Alpha is the
  probability of following the graph, not the restart probability.
  Every round reads only the old vector. Matrix and edge-list versions
  are exposed as M16.matrixStep and M16.messageStep for verification.
  ?slide=N&step=K&round=R&alpha=0.85 opens reproducible states.
  Sources are linked in the relevant speaker notes, available with N.
-->

<script>
'use strict';
const mi=x=>`<mi>${x}</mi>`, mn=x=>`<mn>${x}</mn>`, mo=x=>`<mo>${x}</mo>`;
const sub=(a,b)=>`<msub>${a}${b}</msub>`, sup=(a,b)=>`<msup>${a}${b}</msup>`, row=x=>`<mrow>${x}</mrow>`;
const frac=(a,b)=>`<mfrac>${a}${b}</mfrac>`, math=x=>`<math>${x}</math>`, eq=x=>`<div class="formula">${math(x)}</div>`;
const R=mi('r'), G=mi('G'), U=mi('u'), A=mi('α'), ri=i=>sub(R,mi(i)), rt=t=>sup(R,row(mo('(')+(t==='t+1'?mi('t')+mo('+')+mn(1):mi(t))+mo(')')));
const source1='<a href="https://web.stanford.edu/class/cs315b/assignment3.html">Stanford: the node update and iteration</a>';
const source2='<a href="https://networkx.org/documentation/stable/reference/algorithms/generated/networkx.algorithms.link_analysis.pagerank_alg.pagerank.html">NetworkX: PageRank</a>';
const source3='<a href="https://nlp.stanford.edu/IR-book/html/htmledition/pagerank-1.html">Stanford IR book: the random-surfer interpretation</a>';
const SLIDES=[
 {id:'opening',title:'PageRank: who gets attention?',part:'The question',kind:'opening',
  body:'<p>A node is a web page.</p><p>An arrow is a link to another page.</p><p><strong>How could links give us a score for each page?</strong></p>',
  steps:['Which page would you choose, and why?','C has three incoming links. A and B have one each.','A link from a frequently visited page can bring more visits.'],
  notes:'Use the arrows as hyperlinks. All graphs here are small invented examples. Ask for an initial ranking before naming the algorithm. PageRank measures attention in a particular model of navigation. It is not a direct measure of accuracy, usefulness, or relevance to a query. '+source3},
 {id:'purpose',title:'Why we do this',part:'Purpose',kind:'purpose',
  body:'<p class="subtitle">Many pages can match the same search. PageRank uses their links to help rank them.</p><p class="purpose-point">Who links to a page matters, as well as how many links it receives.</p><p class="purpose-point">One rule at each page lets us compute the scores as <strong>Graph × Data</strong>.</p>',
  steps:[''],
  notes:'The practical question is how to order pages when many match a query. PageRank supplies a score from the link structure. Search ranking can combine that score with relevance and other information. A sender’s contribution depends on its own score and the number of pages it links to. The next slides compute these scores with messages, then express the same operations as matrix multiplication. '+source3},
 {id:'scores',title:'Each node holds a share of attention',part:'One node',kind:'scores',
  body:'<p>Start with a total score of 1.</p><p>Give each of the four nodes an equal share.</p>'+eq(ri('A')+mo('=')+ri('B')+mo('=')+ri('C')+mo('=')+ri('D')+mo('=')+frac(mn(1),mn(4)))+'<p class="note">A score can represent the fraction of many walkers at that node.</p>',
  steps:['Each node starts with 0.25.','The scores form a data vector, one entry per node.'],
  notes:'A useful interpretation is a large population of independent walkers. The scores describe the distribution of the population, rather than the position of a single walker. The calculations update the distribution exactly. No randomness is needed to compute them.'},
 {id:'send',title:'At A: split my score, then send it',part:'One node',kind:'send',
  body:'<p>“I have score 0.25.”</p><p>“I have two outgoing links.”</p><p>“I send half to B and half to C.”</p>'+eq(frac(mn('0.25'),mn(2))+mo('=')+mn('0.125')),
  steps:['A reads its current score and its outgoing links.','A divides 0.25 by its two outgoing links.','B and C each receive a message of 0.125 from A.'],
  notes:'The divisor belongs to the sender. A distributes its whole current score. It does not keep an extra copy. Each walker at A chooses one of its two links with equal probability. The graph is fixed while the scores change.'},
 {id:'receive',title:'At C: add the messages that arrive',part:'One node',kind:'receive',
  body:'<p>“A, B, and D link to me.”</p><p>“I add their messages to get my new score.”</p>'+eq(ri('C')+mo('′')+mo('=')+mn('0.125')+mo('+')+mn('0.25')+mo('+')+mn('0.25'))+'<p><strong>New score at C: 0.625.</strong></p>',
  steps:['C needs the incoming messages, already divided by each sender.','A sends 0.125. B and D each send 0.25.','C adds the three messages. C does not divide by three.'],
  notes:'Explain the two local roles separately. A sender divides by its number of outgoing links. A receiver adds what arrives. This is not the average of its incoming neighbors’ scores. The prime marks the next round, not a derivative.'},
 {id:'round',title:'One round across the whole graph',part:'Message passing',kind:'round',
  body:'<p>Each node sends from its <strong>old score</strong>.</p><p>Each node collects a <strong>new score</strong>.</p><p>Replace the old scores after all messages arrive.</p><p class="note">Every node follows the same rule.</p>',
  steps:['The old vector is (0.25, 0.25, 0.25, 0.25).','All five links carry messages from that old vector.','New scores: (0.25, 0.125, 0.625, 0). The total is still 1.'],
  notes:'This is a synchronous round. Do not overwrite A’s score and then use the changed value to compute B in the same round. A real parallel program needs a mechanism to separate rounds. The animation is a model of the dependencies, not a prescription for one processor per node.'},
 {id:'repeat',title:'The output becomes the next input',part:'Message passing',kind:'repeat',knobs:['round'],
  body:'<p>Split, send, add. Then repeat.</p><p>A node’s score now depends on paths through the graph.</p><p class="note">So far, walkers only follow links. D has no incoming links.</p>',
  steps:['Move the round slider, or step through the first rounds.','After one round, D has no score.','Later rounds keep redistributing the same total score.','In this graph, the scores approach (0.4, 0.2, 0.4, 0).'],
  notes:'A and C approach the same score even though C has three incoming links and A has only one. The sources of those links matter. This particular graph converges. Link-following alone does not guarantee that behavior for every graph. All displayed values come from the computed iterates.'},
 {id:'problems',title:'Following links can trap or cycle',part:'Why restart?',kind:'problems',
  body:'<p><strong>A closed group:</strong> walkers cannot leave by following links.</p><p><strong>A two-node cycle:</strong> unequal scores swap every round.</p><p>We need a way to start elsewhere.</p>',
  steps:['A closed group has no outgoing route to the rest of the graph.','A score distribution can alternate: (0.8, 0.2), then (0.2, 0.8).','Allow a walker to jump to any node, even without a link.'],
  notes:'These are separate examples, not claims that every closed group oscillates. The cycle starts with unequal scores so that the failure to converge is visible. A uniform initial vector on that cycle would already be stationary. Positive uniform restart resolves both issues. '+source3},
 {id:'restart',title:'A small chance of starting elsewhere',part:'PageRank',kind:'restart',
  body:'<p>At each move:</p><ul><li>Follow a link with probability <strong>0.85</strong>.</li><li>Jump to a uniformly chosen node with probability <strong>0.15</strong>.</li></ul><p>Each node receives '+math(frac(mn('0.15'),mn(4))+mo('=')+mn('0.0375'))+' from restarts.</p>',
  steps:['α = 0.85 is the probability of following links.','Only 85% of the score follows the graph.','The remaining 15% spreads equally across all four nodes.'],
  notes:'The value 0.85 is a common choice, not a law. A jump may land on the current node. Scores are probabilities, so following links and restarting divide a total mass of one. The two parts must not be added at full strength. '+source2},
 {id:'localrule',title:'At C: messages plus a restart share',part:'PageRank',kind:'localrule',
  body:'<p>C first adds the incoming shares.</p>'+eq(mn('0.125')+mo('+')+mn('0.25')+mo('+')+mn('0.25')+mo('=')+mn('0.625'))+'<p>Then it applies the PageRank rule.</p>'+eq(mn('0.85')+mo('×')+mn('0.625')+mo('+')+mn('0.0375'))+'<p><strong>New score at C: 0.56875.</strong></p>',
  steps:['The same incoming messages give a link-following score of 0.625.','Scale that total by 0.85, giving 0.53125.','Add 0.0375 from restarts. D receives its restart share too.'],
  notes:'The displayed numbers use the initial uniform vector. Scaling every message by alpha before sending gives the same result as scaling the receiver’s sum afterward. The full updated vector is (0.25, 0.14375, 0.56875, 0.0375).'},
 {id:'ranking',title:'Repeated rounds settle into a ranking',part:'PageRank',kind:'ranking',knobs:['alpha','round'],
  body:'<p>Start at equal scores.</p><p>Repeat until consecutive score vectors change very little.</p><p><strong>PageRank:</strong> the limiting score of each node.</p><p class="note">Change α to compare links with restarts. At α = 0, every score is ¼.</p>',
  steps:['The sliders control α and the number of completed rounds.','The first round uses one-hop messages.','Later rounds include the effects of longer paths.','With α = 0.85, the ranking is C, A, B, D.'],
  notes:'With uniform restarts and 0 ≤ alpha < 1, the iteration converges to a unique probability vector. The slider stops at 0.99. Sixty rounds may still show visible changes for some high-alpha examples, so the readout reports change rather than declaring convergence at a fixed round count. “Limiting” does not mean exact finite-step equality.'},
 {id:'stop',title:'When can we stop?',part:'PageRank',kind:'stop',
  body:'<p>Add the absolute changes across nodes.</p>'+eq('<mtext>change</mtext>'+mo('=')+sub(mo('∑'),mi('i'))+mo('|')+sub(mi('new'),mi('i'))+mo('−')+sub(mi('old'),mi('i'))+mo('|'))+'<p>Stop below a chosen tolerance.</p><p class="note">Also set a maximum number of rounds. A small change is a stopping rule, not exact equality.</p>',
  steps:['Compare the entire old and new vectors.','Small changes at every node make a small total change.','At α = 0.85, this example reaches change < 10⁻⁶ in the displayed round.'],
  notes:'The illustration uses the sum of absolute changes, or L1 difference, and a tolerance of 1e-6. Distinguish tolerance from maximum iterations. In this contraction, a bound on error to the limit follows from the change and alpha, but that proof is outside this lesson. The criterion here is an absolute total tolerance, not NetworkX’s n-times-tol convention.'},
 {id:'bridge',title:'Message passing is a matrix product',part:'Graph × Data',kind:'bridge',
  body:'<p>The graph tells us <strong>where to send</strong> each value.</p><p>The score vector tells us <strong>how much to send</strong>.</p><p>Can an array do all the sending and adding?</p>',
  steps:['We already know the answer for one round.','Store the graph’s sending rules in a matrix.','Graph × Data gives the received scores.'],
  notes:'Keep the same graph and the same first-round scores visible. The matrix is a second representation of the message-passing calculation, not a new algorithm. For now the product gives the link-following result. Restart is added after it.'},
 {id:'edges',title:'The graph is data too',part:'Graph × Data',kind:'edges',
  body:'<p>An edge list stores pairs of node IDs.</p><p>A matrix stores the same links as entries.</p><p><strong>Our convention:</strong><br>column = sender<br>row = receiver</p>'+eq(sub(mi('H'),row(mi('C')+mo(',')+mi('A')))+mo('=')+mn(1)),
  steps:['The graph has four nodes and five directed edges.','The pair (A, C) means A sends to C.','Put a 1 in row C, column A. Missing links have value 0.'],
  notes:'H is the unnormalized link matrix. Many graph libraries choose the opposite adjacency convention, so explicitly read this one as receiver-by-sender. With column-vector scores that makes G times r the incoming-message computation. Numeric node IDs are labels, not measured features.'},
 {id:'columns',title:'Each column describes one sender',part:'Graph × Data',kind:'columns',choices:'sender',
  body:'<p>Divide each column of H by its number of links.</p><p>Call the result <strong>G</strong>.</p><p>For example, A’s column sends ½ to B and ½ to C.</p><p class="note">Each column sums to 1.</p>',
  steps:['Select a sender to inspect its column and outgoing links.','Replace each 1 by the fraction of that sender’s score it carries.','A column is one node’s complete sending rule.'],
  notes:'G is a column-stochastic transition matrix, although students do not need that term. Nonnegative entries in each column sum to one. Each sender distributes its whole score, so the total score stays the same.'},
 {id:'onerow',title:'One row collects one node’s messages',part:'Graph × Data',kind:'onerow',
  body:'<p>Row C gives the fractions that arrive from A, B, C, and D.</p><p>Multiply each fraction by that sender’s score.</p><p>Add the products.</p>'+eq(sub(mi('q'),mi('C'))+mo('=')+mn('0.625')),
  steps:['Read row C: (½, 1, 0, 1).','Multiply by the current scores: (¼, ¼, ¼, ¼).','The row product adds exactly the messages C received earlier.'],
  notes:'q denotes the result of link-following alone. The zero for sender C is deliberate: C has no self-link. Multiplication by the sender’s score, followed by summation, is the dot product students already know.'},
 {id:'product',title:'All rows collect at once',part:'Graph × Data',kind:'product',
  body:eq(mi('q')+mo('=')+G+R)+'<p>One row of G for each receiver.</p><p>One entry of r for each sender.</p><p><strong>Matrix multiplication performs every receiver’s sum.</strong></p>',
  steps:['G has shape 4 × 4. The score vector has shape 4 × 1.','Each row uses the same old vector r.','The product is (0.25, 0.125, 0.625, 0), just as before.'],
  notes:'The multiplication is conventional matrix multiplication. It is not entrywise multiplication. Its output has four rows and one column, so the same node order must label both the input and output.'},
 {id:'fullupdate',title:'The complete PageRank update',part:'Graph × Data',kind:'fullupdate',
  body:eq(rt('t+1')+mo('=')+A+G+rt('t')+mo('+')+mo('(')+mn(1)+mo('−')+A+mo(')')+U)+'<p><strong>G:</strong> the graph’s sending fractions</p><p><strong>r:</strong> current scores</p><p><strong>u:</strong> equal restart shares, each 1/N</p>',
  steps:['G r computes the incoming shares.','Multiply by α to keep the link-following part.','Add (1 − α)u. This vector becomes the next input.'],
  notes:'N is the number of nodes. This lesson uses u_i = 1/N. G records the outgoing splits, with senders in columns and receivers in rows. At convergence the left and right score vectors agree. No eigenvector derivation is needed.'},
 {id:'code',title:'The same round in code',part:'Graph × Data',kind:'code',
  body:'<p>The loop follows edges.</p><p>The product follows the same weights stored in G.</p><p>Both read <span class="code">old</span> and create <span class="code">new</span>.</p><p class="note">In NumPy, <span class="code">@</span> is matrix multiplication. <span class="code">*</span> multiplies entries.</p>',
  steps:['The edge loop divides each sender’s old score and adds it at each receiver.','G already stores those sending fractions.','Both versions produce identical new scores.'],
  notes:'The code performs one update on our example if out, old, G, and alpha are supplied. out is an adjacency list of receiver indices for each sender. Every node in this example has an outgoing link. G uses the receiver-by-sender convention. The vector shape is (N,) in the NumPy code, which represents the same mathematical column vector.'},
 {id:'features',title:'Several data columns, one graph',part:'Graph × Data',kind:'features',
  body:eq(mi('Y')+mo('=')+G+mi('X'))+'<p>Rows of X correspond to nodes.</p><p>Each column carries a different value.</p><p>The same graph sends and adds each column separately.</p><p class="note">PageRank uses one score column, followed by the restart step.</p>',
  steps:['Here X has two columns of node values.','For C, the same row of G combines both columns.','Graph (N × N) times Data (N × d) gives Data (N × d).'],
  notes:'This is a general message-passing operation with scalar edge weights. Arbitrary feature columns do not become PageRank merely by multiplying once. They may have different units and need not sum to one. The worked second column here is (1, 2, 3, 4), yielding (3, 0.5, 6.5, 0).'},
 {id:'editgraph',title:'One extra link changes the ranking',part:'Graph × Data',kind:'editgraph',choices:'edge',
  body:'<p>Add a link from C to D.</p><p>C now sends half to A and half to D.</p><p>That changes a column of G and the resulting ranking.</p><p class="note">The graph and the scores are both data. The graph also defines how scores move.</p>',
  steps:['Compare the original graph with one extra edge.','C’s column changes from (1, 0, 0, 0) to (½, 0, 0, ½).','The scores settle to a different ranking: C, then A and D tied, then B. A and D now receive the same thing, half of C.'],
  notes:'The button recomputes the scores from uniform initialization to a tight numerical tolerance at alpha 0.85. It does not edit a live website or external graph. C has two outgoing links in the modified graph, so both of its weights change. A and D tie exactly: each receives only half of C’s score, plus the same restart share. Graph structure is input data to the algorithm.'},
 {id:'sparse',title:'Only existing links need messages',part:'Computation',kind:'sparse',
  body:'<p>Let N be the nodes and E the edges.</p><p>An edge list stores the links in <strong>O(N + E)</strong> space.</p><p>One PageRank round takes <strong>O(N + E)</strong> work.</p><p class="note">A dense N × N matrix would also store the missing links.</p>',
  steps:['Our graph sends one weighted message along each of its five edges.','Following the edge list takes one multiply-and-add per edge.','Add the restart share in one pass over the N nodes.'],
  notes:'The bound assumes adjacency lists or a sparse matrix. Each edge contributes one weighted message. Initializing the vector with uniform restart shares takes O(N) work, and following the edges takes O(E). There is no need to materialize a dense matrix of restart links.'},
 {id:'exercise',title:'Your turn: one update at C',part:'Practice',kind:'exercise',
  body:'<p>Current scores:</p>'+eq(R+mo('=')+mo('(')+mn('0.4')+mo(',')+mn('0.2')+mo(',')+mn('0.3')+mo(',')+mn('0.1')+mo(')'))+'<p>Use α = 0.85 and uniform restarts.</p><ol><li>What does A send to C?</li><li>What is C’s new score?</li><li>Which matrix entry represents A sending to C?</li></ol>',
  steps:['Write the three answers before revealing the calculation.','A sends 0.4 ÷ 2 = 0.2 to C. C receives 0.2 + 0.2 + 0.1 = 0.5.','C’s new score is 0.85 × 0.5 + 0.0375 = 0.4625. The entry is G[C, A] = ½.'],
  notes:'Collect a three-part response. The two common errors are dividing by C’s incoming degree and treating G[A,C] as the A-to-C weight. Students can check that the other updated scores are A: 0.2925, B: 0.2075, D: 0.0375, giving a total of one.'},
 {id:'closing',title:'PageRank: nodes, messages, and matrices',part:'Essentials',kind:'closing',
  body:'<p><strong>One node:</strong> split outgoing score, add incoming messages.</p><p><strong>All nodes:</strong> repeat the update with restarts.</p><p><strong>One product:</strong> the graph mixes the node data.</p>'+eq(rt('t+1')+mo('=')+A+G+rt('t')+mo('+')+mo('(')+mn(1)+mo('−')+A+mo(')')+U),
  steps:['G records who sends to whom, and how much.','r records the current score at each node.','The same local rule appears in every row of the product.'],
  notes:'The central connection is between a local computation and a global array operation. The graph is data in an edge list or matrix. In the product, that graph data acts on the current node data. Restarts keep score circulating across the graph. References: '+source1+'; '+source2+'; '+source3}

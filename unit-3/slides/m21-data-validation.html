    "title": "We are “models”",
    "part": "Models",
    "kind": "human-models",
    "minutes": 2,
    "body": "<p><strong>Predicting is evidence of learning.</strong></p><p>Experience shapes our models of the world.</p><p>Can we use them in a new situation?</p>",
    "steps": [],
    "staticFrame": 0,
    "notes": {
      "say": "Say: “We are models.” Use this as a metaphor: people build and use mental models of the world. Dark clouds make us expect rain because of experience. A prediction can guide an action, such as taking an umbrella. Successful predictions on new cases provide evidence of learning; one lucky guess or a memorized answer alone is weak evidence.",
      "ask": "When you see dark clouds and take an umbrella, what are you predicting? Where did that expectation come from?",
      "answer": "Rain is likely. Past experience connects the visible clouds with an expected outcome. The prediction can be useful without being certain.",
      "demo": "Show the whole example immediately. Ask for one everyday prediction from the class, then move to sentence completion."
    }
  },

    "language": "en",
    "minutes": 1,
    "body": "<p>Now complete the sentence in English.</p><p>What did you already know that helped you predict?</p>",

    "part": "Models",
    "kind": "learning-algorithms",
    "minutes": 1,
    "body": "<p><strong>Algorithms for developing models of the world.</strong></p><p>A learning algorithm uses examples to build a model.</p><p>The learned model predicts from new inputs.</p>",
    "steps": [],
    "staticFrame": 0,
    "notes": {
      "say": "A model represents patterns relevant to a task; it is not a complete copy of the world. A learning algorithm uses examples to develop that model. Once learned, the model can take new inputs and produce predictions. In the supervised problems here, examples pair inputs with observed answers. The model is the result of learning, while the learning algorithm is the procedure that develops it.",
      "ask": "In the sentence exercises, what plays the role of prior examples? What plays the role of the new input?",
      "answer": "Prior exposure to language and the world provides experience. The incomplete sentence is the new input, and the supplied word is the prediction. In the rental task, past daily records provide examples and a new day’s available information is the input.",
      "demo": "Show both rows together. Point from examples through learning to a model, then from new inputs through that model to a prediction. Give these two actions programmatic names next."
    }

const C={ink:'#1a1a1a',muted:'#555',grid:'#ddd',blue:'#2a78d6',red:'#cc0033',orange:'#d85b20',purple:'#6a3fb5',green:'#18794e',paper:'#f7f7f5'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(x,d=0)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const NUM={mae:(y,p)=>y.reduce((a,v,i)=>a+Math.abs(v-p[i]),0)/y.length,mse:(y,p)=>y.reduce((a,v,i)=>a+(v-p[i])**2,0)/y.length,
 predict:(name,rows)=>rows.map(r=>name==='mean'?DATA.mean:name==='yesterday'?r.yesterday:DATA.results.line.intercept+DATA.results.line.coef[0]*r.yesterday+DATA.results.line.coef[1]*r.work)};
const txt=(x,y,s,size=22,color=C.ink,anchor='start',weight=400)=>`<text x="${x}" y="${y}" fill="${color}" font-size="${size}" text-anchor="${anchor}" font-weight="${weight}">${esc(s)}</text>`;
const rect=(x,y,w,h,fill,stroke='none',rx=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}" rx="${rx}"/>`;
const line=(x1,y1,x2,y2,color=C.grid,width=1,dash='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
const dot=(x,y,color=C.blue,r=5)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${color}"/>`;
function wrap(x,y,text,max=48,size=22,color=C.ink){let rows=[],current='';for(const word of text.split(' ')){if((current+' '+word).trim().length>max){rows.push(current);current=word;}else current=(current+' '+word).trim();}if(current)rows.push(current);if(rows.length>1){let last=rows.length-1;while(rows[last].length<max*.42){let words=rows[last-1].split(' ');if(words.length<2)break;const word=words.pop();if(words.join(' ').length<max*.42||word.length+1+rows[last].length>max)break;rows[last-1]=words.join(' ');rows[last]=word+' '+rows[last];}}return rows.map((s,i)=>txt(x,y+i*size*1.35,s,size,color)).join('');}
function svg(title,body){return `<svg viewBox="0 0 720 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(title)}"><title>${esc(title)}</title><defs><clipPath id="plotclip"><rect x="85" y="87" width="605" height="363"/></clipPath></defs>${body}</svg>`;}
function heading(title,sub=''){return txt(26,36,title,24,C.muted,'start',600)+(sub?txt(26,64,sub,17,C.muted):'');}
function plot({x0=0,x1=1,y0=0,y1=1,xlabel='',ylabel='',xticks=null,yticks=null}){const L=85,R=690,T=88,B=450;const X=x=>L+(x-x0)/(x1-x0)*(R-L),Y=y=>B-(y-y0)/(y1-y0)*(B-T);let h='';const ticks=yticks||Array.from({length:5},(_,i)=>y0+(y1-y0)*i/4);for(const t of ticks)h+=line(L,Y(t),R,Y(t))+txt(L-12,Y(t)+6,fmt(t,Math.abs(y1-y0)<=6?1:0),17,C.muted,'end');const xs=xticks||Array.from({length:5},(_,i)=>({value:x0+(x1-x0)*i/4,label:fmt(x0+(x1-x0)*i/4,Math.abs(x1-x0)<5?1:0)}));for(const t of xs)h+=line(X(t.value),B,X(t.value),B+6,C.muted)+txt(X(t.value),B+27,t.label,17,C.muted,X(t.value)>670?'end':'middle');h+=line(L,T,L,B,C.muted,1.5)+line(L,B,R,B,C.muted,1.5)+txt((L+R)/2,514,xlabel,20,C.ink,'middle')+`<text transform="translate(24 270) rotate(-90)" text-anchor="middle" font-size="20" fill="${C.ink}">${esc(ylabel)}</text>`;return {h,X,Y};}
function curve(points,X,Y,color=C.blue,width=2.5){return `<path d="${points.map(([x,y],i)=>(i?'L':'M')+X(x).toFixed(2)+','+Y(y).toFixed(2)).join(' ')}" fill="none" stroke="${color}" stroke-width="${width}"/>`;}

const defaults={step:0,constant:5,metric:'mae',model:'mean',degree:'3',showValid:false,splitMode:'chrono',selected:[]};
const states=Object.fromEntries(SLIDES.map(s=>[s.id,{...defaults,...s.defaults,selected:[]}]));
let current=0,returnFocus=null;
const controls={
 constant:()=>'<label for="constant-input">Prediction c</label><div class="range"><input id="constant-input" data-key="constant" type="range" min="0" max="10" step="0.5"><output></output></div>',
 metric:()=>'<label for="metric-input">Error metric</label><select id="metric-input" data-key="metric"><option value="mae">MAE · rentals</option><option value="mse">MSE · rentals²</option></select>',
 model:()=>'<label for="model-input">Predictor</label><select id="model-input" data-key="model"><option value="mean">Training mean</option><option value="yesterday">Yesterday’s count</option><option value="line">Fitted linear model</option></select>',
 degree:()=>'<label for="degree-input">Curve degree</label><select id="degree-input" data-key="degree">'+[1,2,3,5,9,12].map(d=>`<option value="${d}">${d}</option>`).join('')+'</select>',
 showValid:()=>'<label for="validation-input">Show validation</label><input id="validation-input" data-key="showValid" type="checkbox">',
 splitMode:()=>'<label for="split-input">Split</label><select id="split-input" data-key="splitMode"><option value="chrono">Chronological</option><option value="shuffle">Shuffled development rows</option></select>'
};
const stage=document.querySelector('.stage'),host=document.getElementById('slides'),panel=document.querySelector('.notes');
function resize(){const scale=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${scale})`;stage.style.left=(innerWidth-1280*scale)/2+'px';stage.style.top=(innerHeight-720*scale)/2+'px';}
function setURL(){const s=SLIDES[current],st=states[s.id],p=new URLSearchParams({id:s.id,step:st.step});for(const k of s.controls||[])p.set(k,st[k]);history.replaceState(null,'','?'+p.toString());}
function hasReveals(s){return !!s.frames&&s.steps.length>1;}
function controlPanel(s){
 const reveal=hasReveals(s),interactive=(s.controls||[]).length>0;
 if(!reveal&&!interactive)return '';
 const inputs=(s.controls||[]).map(k=>`<div class="control">${controls[k]()}</div>`).join('');
 const advance=reveal?'<button class="primary" data-action="step"></button>':'';
 const caption=reveal?'<div class="readout" aria-live="polite"><div class="step-text"></div></div>':'';
 return `<div class="ctl">${inputs}<div class="buttons">${advance}<button data-action="reset">Reset</button></div>${caption}</div>`;
}
function update(){
 const s=SLIDES[current],st=states[s.id],el=host.querySelector('.slide');
 if(s.kind!=='title'&&s.kind!=='divider'){
  const phase=s.frames?s.frames[st.step]:(s.staticFrame??st.step);
  el.querySelector('.pic').innerHTML=visual(s,{...st,step:phase});
  if(hasReveals(s)){
   const button=el.querySelector('[data-action=step]');
   el.querySelector('.step-text').textContent=s.steps[st.step];
   button.disabled=st.step>=s.steps.length-1;
   button.textContent=button.disabled?'Revealed':s.revealLabels[st.step];
  }
  for(const key of s.controls||[]){
   const input=el.querySelector(`[data-key=${key}]`);
   if(input.type==='checkbox')input.checked=!!st[key];else input.value=st[key];
   if(key==='constant')input.nextElementSibling.value=fmt(st.constant,1);
  }
 }
 document.getElementById('counter').textContent=`${current+1} / ${SLIDES.length}`;
 document.getElementById('prev').disabled=current===0;
 document.getElementById('next').disabled=current===SLIDES.length-1;setURL();
}
function go(index){
 current=Math.max(0,Math.min(SLIDES.length-1,index));closePanel(false);
 const s=SLIDES[current];stage.classList.toggle('is-divider',s.kind==='divider');
 if(s.kind==='divider'){
  document.activeElement?.blur();
  host.innerHTML=`<section class="slide divider" aria-label="${esc(s.title)} section"><h2>${esc(s.title)}</h2></section>`;
 }else if(s.kind==='title'){
  host.innerHTML=`<section class="slide purpose"><p class="eyebrow">CS 301 · Unit III · ${s.part}</p><h2>${s.title}</h2>${s.body}<div class="title-rule"></div><p class="title-note">${s.steps[0]}</p></section>`;
 }else{
  host.innerHTML=`<section class="slide" aria-label="${esc(s.title)}"><h2>${s.title}<span class="part">${s.part}</span></h2><div class="row"><div class="pic"></div><div class="side"><div class="copy">${s.body}</div>${controlPanel(s)}</div></div></section>`;
 }
 update();
}
function step(){
 const s=SLIDES[current],st=states[s.id];
 if(hasReveals(s)&&st.step<s.steps.length-1){st.step++;update();}else go(current+1);
}
function reset(){const s=SLIDES[current];states[s.id]={...defaults,...s.defaults,selected:[]};update();}
function closePanel(focus=true){panel.hidden=true;if(focus&&returnFocus?.isConnected)returnFocus.focus();}
function openPanel(kind){returnFocus=document.activeElement;panel.hidden=false;panel.innerHTML='<button class="close" data-action="close" aria-label="Close panel">Close</button>';
 if(kind==='toc')panel.innerHTML+='<h3>Meeting 21 · Contents</h3><div class="toc">'+SLIDES.map((s,i)=>`<button data-goto="${i}">${i+1}. ${esc(s.title)}</button>`).join('')+'</div>';
 else{const s=SLIDES[current];panel.innerHTML+=`<h3>${current+1}. ${esc(s.title)} · ${s.minutes} min</h3>`+Object.entries(s.notes).filter(([k])=>k!=='sources').map(([k,v])=>`<p><strong>${{say:'Talking points',ask:'Ask',answer:'Expected answer',demo:'Demonstration'}[k]}.</strong> ${esc(v)}</p>`).join('')+(s.notes.sources||[]).map(k=>`<p class="source-link"><a href="${SOURCES[k][1]}" target="_blank" rel="noopener">${esc(SOURCES[k][0])}</a></p>`).join('');}panel.querySelector('button').focus();}
host.addEventListener('click',e=>{if(SLIDES[current].kind==='divider'){const bounds=stage.getBoundingClientRect();go(current+(e.clientX<bounds.left+bounds.width/2?-1:1));}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.feature){const st=states[SLIDES[current].id],key=b.dataset.feature;st.selected=st.selected.includes(key)?st.selected.filter(k=>k!==key):[...st.selected,key];update();return;}if(b.dataset.goto!==undefined){go(+b.dataset.goto);return;}const action=b.dataset.action||b.id;({prev:()=>go(current-1),next:()=>go(current+1),step,reset,close:()=>closePanel(),toc:()=>openPanel('toc'),notes:()=>panel.hidden?openPanel('notes'):closePanel(),full:()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()})[action]?.();});
document.addEventListener('input',e=>{if(!e.target.dataset.key)return;states[SLIDES[current].id][e.target.dataset.key]=e.target.type==='checkbox'?e.target.checked:e.target.value;update();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel();return;}if(!panel.hidden)return;if(/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName))return;const key=e.key.toLowerCase();const fn=({'arrowright':()=>go(current+1),'arrowleft':()=>go(current-1),' ':step,'n':()=>openPanel('notes'),'t':()=>openPanel('toc'),'r':reset,'home':()=>go(0),'end':()=>go(SLIDES.length-1),'f':()=>document.getElementById('full').click()})[key];if(fn){e.preventDefault();fn();}});
addEventListener('resize',resize);resize();const query=new URLSearchParams(location.search);const idx=query.has('id')?SLIDES.findIndex(s=>s.id===query.get('id')):Number(query.get('slide')||1)-1;current=idx<0?0:Math.min(idx,SLIDES.length-1);const first=SLIDES[current],st=states[first.id];st.step=Math.max(0,Math.min(first.steps.length-1,Number(query.get('step')||0)));for(const key of first.controls||[])if(query.has(key)){const val=query.get(key);if(key==='showValid')st[key]=val==='true';else if(key==='constant')st[key]=Math.max(0,Math.min(10,+val||0));else if(key==='degree'&&['1','2','3','5','9','12'].includes(val))st[key]=val;else if(key==='metric'&&['mae','mse'].includes(val))st[key]=val;else if(key==='model'&&['mean','yesterday','line'].includes(val))st[key]=val;else if(key==='splitMode'&&['chrono','shuffle'].includes(val))st[key]=val;}
window.M21={SLIDES,states,NUM,DATA,go,update,reset,get current(){return current;}};go(current);document.documentElement.dataset.ready='yes';
</script></body></html>

</style></head><body><main id="stage"><div id="lectureResetControls" role="group" aria-label="Lecture reset controls" hidden><button id="restartLecture" type="button" title="Reset all demonstrations; keep annotations">↺ Restart lecture</button><button id="resetAnnotations" type="button" title="Clear ink and text on all slides; Undo restores annotations on each slide">Reset annotations</button></div><nav class="topnav" aria-label="Presentation controls"><select id="act" aria-label="Jump to section"></select><button id="showOverview" title="Slide overview (O)">Slides</button><button id="showNotes" title="Instructor notes (N)">Notes</button><button id="full" title="Fullscreen (F)">⛶ Fullscreen</button></nav><article id="slide" aria-label="Current slide"></article><footer class="footer"><div><a class="source" id="source" target="_blank" rel="noopener"></a></div><div class="right"><span>← → navigate · Space reveal</span><button id="previous" aria-label="Previous slide">←</button><span id="counter"></span><button id="next" aria-label="Next slide">→</button></div></footer><div id="progress" class="track"></div></main><dialog id="overview"><button onclick="this.closest('dialog').close()">Close</button><h2>Learning how to use memory</h2><div id="overviewList" class="overview-list"></div></dialog><div id="print" class="print-only"></div><noscript>This lecture requires JavaScript. Open it in a browser.</noscript><dialog id="notes"><button id="closeNotes">Close</button><h2 id="notesTitle"></h2><div id="notesText"></div></dialog><script>const DECK={"meeting":24,"title":"Learning how to use memory","subtitle":"Unit III · Meeting 4","acts":["Memory","Attention","Temperature","Learning","Evaluation","Relevance","Memory and parameters"],"route":[{"act":0,"minutes":8,"focus":"Recall neighbor regression and unequal influence"},{"act":1,"minutes":12,"focus":"Define queries, keys, and values, then compute attention"},{"act":2,"minutes":12,"focus":"Explore temperature, prediction curves, and a reflection"},{"act":3,"minutes":15,"focus":"State the objective, train one temperature, and translate the update into PyTorch"},{"act":4,"minutes":13,"focus":"Evaluate new-query prediction, expose copying, and compare methods"},{"act":5,"minutes":10,"focus":"Learn which feature makes stored examples relevant"},{"act":6,"minutes":10,"focus":"Change memory and parameters separately, then review"}],"sources":[{"id":"attention","title":"Dive into Deep Learning: Attention Pooling and Nadaraya–Watson Regression","url":"https://classic.d2l.ai/chapter_attention-mechanisms/nadaraya-watson.html"},{"id":"qkv","title":"Dive into Deep Learning: Queries, Keys, and Values","url":"https://en.d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html"},{"id":"autograd","title":"PyTorch: Automatic Differentiation","url":"https://docs.pytorch.org/tutorials/beginner/basics/autogradqs_tutorial.html"},{"id":"leakage","title":"scikit-learn: Common Pitfalls and Recommended Practices","url":"https://scikit-learn.org/stable/common_pitfalls.html"},{"id":"pytorch-optimization","title":"PyTorch: Optimizing Model Parameters","url":"https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial.html"},{"id":"pytorch-softmax","title":"PyTorch: torch.softmax","url":"https://docs.pytorch.org/docs/stable/generated/torch.softmax.html"},{"id":"pytorch-parameter","title":"PyTorch: Parameter","url":"https://docs.pytorch.org/docs/stable/generated/torch.nn.parameter.Parameter.html"}],"guideIntroduction":"This 39-slide, 80-minute lecture connects stored examples with learned parameters. Query, key, and value are introduced before the attention calculation. A temperature slider develops concentration, then an explicit loss-minimization problem gives the purpose of one training demonstration. Its three visible teaching points distinguish measuring training error, updating the parameter, and evaluating separate queries. Three short PyTorch slides then translate the same one-parameter model into fixed tensors, a differentiable forward pass, and an optimization loop with separate evaluation. The Evaluation section asks whether the resulting procedure predicts new observations under a fair comparison. A separate two-feature experiment introduces learned relevance. Two prompt-only reflections and a closing review give students time to explain the distinctions. The lecture assumes no notebook, submission destination, grade, or deadline.","optionalCuts":"If discussion takes longer, compare only three temperatures and shorten the single training run. Preserve the query/key/value definitions, the loss-minimization objective, one visible parameter update, the self-copying problem, separate validation, and both reflections. Use the computed comparison after the training demonstration rather than replaying it. The feature-weight experiment is the extension: show its initial and trained states if there is no time to explore the controls. Leave detailed derivatives and alternative initializations to the instructor notes. The PyTorch walkthrough takes six minutes; if time is tight, identify the single optimized parameter, the softmax dimension, and backward versus step without reading every line.","revision":"2026-11-18","slides":[{"act":0,"minutes":1,"title":"Learning how to use memory","scene":"cover","cover":true,"body":"<p>A model can retain examples and learn how much influence to give them.<\/p>","note":"Open with the existing distinction between a neural network that retains learned parameters and a neighbor predictor that retains examples. Ask whether a model could retain both. Do not answer by listing architectures. Point to the stored observations and a new query in the figure. The lecture will construct a working answer using one learned temperature, then a learned feature weight. All numerical demonstrations use synthetic teaching data. The title refers to a prediction model's stored examples, not human memory or a language model's conversation history."},{"act":0,"minutes":4,"title":"Same neighbors, different influence","scene":"recall","mode":"compare","defaults":{"weighted":false},"body":"<p>Keep the five stored observations fixed. Compare equal shares with distance-based weights.<\/p>","note":"Use this single demonstration for both weighting rules. Start with Equal weights and ask students to compute the average of the five visible targets: 3.12. Then choose Distance weights in the same view. The prediction, table, and connecting line widths change together; the five observations and query stay fixed. Use the persistent bullets to separate the three points: equal shares, proximity-dependent shares, and unchanged memory.\n\nRaw inverse distances are divided by their sum, so all weights remain positive and sum to one. Ask students to identify the farther target and explain its reduced influence. Toggle back to Equal weights to compare again. The status shows both predictions and the current share of the farther observation.\n\nThis small constructed example is the bridge from the previous meeting. The attention rule introduced later uses an exponential of negative squared distance, not inverse distance. The two formulas are distinct. All five distances here are positive; an exact zero in inverse-distance regression requires a separately defined handling rule. Keep this five-example illustration distinct from the larger synthetic training experiment.","teachingPoints":[{"title":"Equal shares","text":"Each target contributes 1/5, including the farther observation."},{"title":"Closer counts more","text":"Normalize inverse distances so nearby targets receive larger shares."},{"title":"Same memory","text":"The stored observations stay fixed. Only their influence changes."}]},{"act":0,"minutes":3,"title":"How local should a prediction be?","scene":"cards","body":"<p>A nearby observation may be noisy. A broad average may combine observations with different targets.<\/p><div class=\"task\"><b>Discuss<\/b><p>When would you want several examples to influence the answer?<\/p><\/div>","items":[{"title":"One close observation","text":"It may reflect the local pattern, but it also carries its own noise."},{"title":"Several nearby observations","text":"Averaging can reduce noise when their underlying targets are similar."},{"title":"The whole memory","text":"Distant observations can pull the prediction away from the local pattern."}],"note":"Let students propose a reason for trusting several observations. Useful answers distinguish noise in a measured target from a real change in the underlying relationship. Do not promise that more averaging always helps. The appropriate amount depends on the signal, noise, sampling, representation, and task. This question motivates a controllable concentration parameter. We will first adjust it ourselves, then learn it from prediction errors on separate training queries."},{"act":1,"minutes":2,"title":"Queries, keys, and values","scene":"vocabulary","body":"<p>Compare a new input with stored inputs. Use their associated targets to form a prediction.<\/p>","note":"Introduce these three names before using them in the attention computation. Point to the new input q and call it the query. In each stored pair (x_i, y_i), x_i is the key: compare it with q to judge relevance. The paired target y_i is the value: it supplies a number to combine into the prediction. Keep the link between each key and its own value visible. Ask which part is used for matching and which part contributes to the answer. Expected: compare inputs, combine targets. The new query's unknown target is never used to compute similarity.\n\nThese are roles in a computation. In this regression example, the keys and values are observed inputs and targets. Other attention models can produce keys and values as learned vectors; this example is not a claim that all attention uses stored training labels. Source: Dive into Deep Learning, Queries, Keys, and Values, https://en.d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html.","definitions":[{"symbol":"q","title":"Query","text":"The new input for which we want a prediction."},{"symbol":"xᵢ","title":"Key","text":"A stored input used to judge relevance to the query."},{"symbol":"yᵢ","title":"Value","text":"The observed target paired with that stored input."}]},{"act":1,"minutes":2,"title":"A query and its distances","scene":"attention","mode":"distances","body":"<p>For a new input q, compare its features with the stored inputs xᵢ.<\/p>","note":"Work with the small visible memory before showing a full regression curve. Identify the query, each stored input, and its target value. The distance compares input features only. The new query's unknown target is never part of the similarity calculation. Move the query and ask which stored input becomes closest. Use squared Euclidean distance in this example. If dᵢ denotes ordinary distance, the score uses dᵢ². For vector inputs the same quantity is the sum of squared coordinate differences."},{"act":1,"minutes":2,"title":"Distance becomes a relevance score","scene":"attention","mode":"scores","body":"<p>Use sᵢ = −‖q − xᵢ‖² / τ. A closer stored input gets a larger score.<\/p>","note":"Read the minus sign carefully. A large squared distance becomes a more negative score. A score closer to zero is larger and will receive more influence after normalization. Treat the temperature tau as a positive number for now and hold it fixed during the first calculation. Scores are not yet weights: they can be negative and do not add to one. The exponential converts them to positive quantities. Subtracting the largest score before exponentiating preserves the normalized weights and avoids numerical underflow in the calculation. That numerical implementation detail belongs here in the guide rather than on the student slide."},{"act":1,"minutes":2,"title":"Attention weights add to one","scene":"attention","mode":"weights","body":"<p>Exponentiate the scores, then divide each result by their sum: αᵢ = exp(sᵢ) / Σⱼ exp(sⱼ).<\/p>","note":"Read the displayed raw scores, exponentials, and normalized weights. Ask a student to check that all attention weights are nonnegative and sum to one. This normalization is softmax. The denominator couples the weights: increasing one score changes the normalized shares of the other examples too. The weights describe how the prediction combines targets. They are not probabilities that an example is correct, and they are not yet learned model parameters. Source: Dive into Deep Learning, Attention Pooling and Nadaraya–Watson Regression, https://classic.d2l.ai/chapter_attention-mechanisms/nadaraya-watson.html."},{"act":1,"minutes":2,"title":"Each value contributes its share","scene":"attention","mode":"values","body":"<p>Multiply every stored target by its attention weight and add: ŷ(q) = Σᵢ αᵢ(q)yᵢ.<\/p>","note":"Trace one example through the complete calculation: its distance, its score, its normalized weight, and its weighted target. Add the contributions to obtain the displayed prediction. Move the query and repeat for one example so students see the weights being recomputed. The memory targets stay fixed. A large target with little attention can contribute less than a moderate target with substantial attention. Because the weights form a convex combination, the prediction lies between the smallest and largest stored target values. Keep that observation for the later limitations discussion."},{"act":1,"minutes":2,"title":"A smooth memory predictor","scene":"cards","body":"<p>Every stored example receives a share. Its influence changes smoothly as the query moves.<\/p><div class=\"equation\">ŷ(q) = Σᵢ αᵢ(q)yᵢ<\/div>","items":[{"title":"Stored information","text":"Inputs xᵢ and their observed target values yᵢ."},{"title":"Computed for a query","text":"Distances, normalized attention weights, and a weighted prediction."},{"title":"A choice still to make","text":"The temperature τ controls how concentrated the attention becomes."}],"note":"Summarize the actual computation without replaying every arithmetic step. With a fixed finite memory and a positive temperature, the exponential weighting gives a smooth prediction as a function of the query. This model is Gaussian kernel regression, also called a Nadaraya–Watson estimator. The name is optional vocabulary, not a new algorithm to memorize. At finite temperature all mathematical weights are positive, although faraway contributions may be too small to display or may underflow in finite precision. Computing attention over the full memory requires comparing all stored keys in this demonstration."},{"act":2,"minutes":2,"title":"A high temperature spreads influence","scene":"temperature","defaults":{"theta":4.605170185988092},"body":"<p>At high temperature, the attention weights become more alike and the prediction approaches the memory mean.<\/p>","note":"Introduce the larger synthetic regression dataset. The horizontal axis is a scalar input x, the vertical axis is its noisy observed target. The memory consists of 40 observations. Start at the high-temperature state and move the query. The attention should remain broad and the curve comparatively flat. State the limiting claim precisely: as tau tends to infinity, a fixed finite set of scores tends to zero, softmax tends to uniform weights, and the prediction tends to the mean of the stored targets. A large finite temperature is an approximation to that limit."},{"act":2,"minutes":2,"title":"A low temperature concentrates influence","scene":"temperature","defaults":{"theta":-6.907755278982137},"body":"<p>At low temperature, the closest examples dominate. The curve can follow noise in individual stored targets.<\/p>","note":"Start at tau 0.001 and move the query across adjacent stored inputs. Point to changes in the attention bars alongside the regression curve. With a unique nearest input, the prediction approaches that input's target as tau tends to zero. If several inputs tie for nearest, this rule shares the limiting attention among them. At every positive temperature the curve is continuous, although it can change rapidly. Avoid calling the finite-temperature curve discontinuous or claiming that small temperature always overfits. It is vulnerable to individual target noise in this constructed experiment."},{"act":2,"minutes":2,"title":"Several observations can support a prediction","scene":"temperature","defaults":{"theta":-2.659260036932778},"body":"<p>Adjust the temperature. Look for local structure that survives averaging across nearby noisy observations.<\/p>","note":"Give students a short chance to choose the temperature before using validation performance to judge it. Compare one query near a peak and one near a valley. An intermediate temperature can average several relevant observations without making all targets equally influential. Keep the same memory throughout; changing the dataset while changing temperature would obscure the cause of the difference. The initial tau 0.07 is a useful viewing state for this example, not a universal recommended setting. Do not present the appearance of the curve as proof of predictive accuracy."},{"act":2,"minutes":2,"title":"Temperature changes prediction error","scene":"temperature","mode":"landscape","defaults":{"theta":0},"body":"<p>Each temperature gives predictions for the same training queries. Their mean squared error gives a loss curve.<\/p>","note":"Relate the temperature slider to a point on the loss curve. The curve is computed on separate training queries, using the fixed memory as the source of keys and values. Training-query targets are used to score predictions, not to supply their attention values. The horizontal axis may use log temperature to show a wide range; explicitly distinguish the axis value theta from tau=exp(theta). Ask which direction would reduce the loss from the displayed starting point. This prepares gradient descent without requiring a derivative of the full softmax expression."},{"act":2,"minutes":2,"title":"Concentration and ranking","scene":"cards","body":"<p>For fixed keys and distances, a positive temperature preserves the ordering of the attention weights.<\/p>","items":[{"title":"Closer input","text":"Receives at least as much attention as a farther input."},{"title":"Lower temperature","text":"Increases the relative preference for the closer input."},{"title":"Different ordering","text":"Requires changing the distances, keys, or scoring rule."}],"note":"Ask whether moving the temperature slider ever makes a more distant key outrank a closer key. For positive tau, dividing all negative squared distances by tau and applying softmax preserves their ordering. Temperature changes the ratio of their weights. Equal distances remain tied. This distinction will matter when an irrelevant feature causes the wrong observations to look close. It also prevents the phrase learned attention from suggesting that a single scalar can independently assign any desired weight to every example."},{"act":2,"minutes":2,"title":"Reflection: what can temperature change?","scene":"reflection","body":"<p>Example A is closer to a query than example B.<\/p><p>Can changing a positive temperature make B receive more attention than A? Explain what the temperature can change instead.<\/p>","note":"Allow about 90 seconds for a written explanation and 30 seconds for discussion. Keep this slide prompt-only. Expected answer: no, with fixed distances and this scoring rule, the nearer example retains at least as much attention. Temperature changes concentration and the relative strength of the preference. A large temperature makes the weights more alike; a small temperature concentrates them on the nearest keys. A good answer mentions the fixed distance rule. If students suggest changing feature scaling, acknowledge that it changes distances and is a different operation."},{"act":3,"minutes":2,"title":"Training queries consult a fixed memory","scene":"steps","body":"<p>Split the training observations into a memory bank and queries whose targets measure prediction error.<\/p>","labels":[{"title":"Memory bank","text":"Store 40 input-target pairs as keys and values."},{"title":"Training queries","text":"Predict 80 other targets by consulting that memory."},{"title":"Training loss","text":"Average the squared prediction errors over those 80 queries."}],"note":"Establish the data roles before pressing a training button. Both the memory bank and the training-query set come from the training portion of the problem. The memory supplies known values to combine. Each training query supplies an input, and its separate target is used afterward to measure error. The same observation does not occur in both roles in this demonstration. The validation set contains another 160 observations and does not supply gradients. Reserved test observations are not used or displayed. A leave-one-out scheme within training is another valid teaching construction for independent observations, but this deck uses disjoint sets to keep the roles visible."},{"act":3,"minutes":2,"title":"Choosing the temperature","scene":"optimization","body":"<p>Choose one positive temperature to minimize prediction error over the training queries.<\/p>","definitions":[{"symbol":"M = {(xᵢ, yᵢ)}","text":"The fixed memory of stored inputs and targets."},{"symbol":"(qⱼ, tⱼ), j = 1, …, m","text":"Separate training queries and their observed targets."},{"symbol":"ŷτ(qⱼ)","text":"The attention prediction using memory M at temperature τ."}],"lossFormula":"Ltrain(τ) = (1/m) Σⱼ (ŷτ(qⱼ) − tⱼ)²","optimizationFormula":"minimize Ltrain(τ) over τ > 0","parameterization":"τ = exp(θ), so optimize Ltrain(exp(θ)) over θ ∈ ℝ.","note":"State the optimization problem before the animation. Hold the memory M={(x_i,y_i)} and the m training-query pairs (q_j,t_j) fixed. For every candidate positive temperature tau, compute each attention prediction y_hat_tau(q_j), compare it with its observed training target t_j, square the residual, and average. The objective is L_train(tau) = (1/m) sum_j (y_hat_tau(q_j)-t_j)^2. We seek a positive tau that makes this loss small. The temperature is the decision variable; the observed inputs and targets are data. The memory's y_i values and the fitting queries' t_j targets have different roles, even though both are observed target values.\n\nUse tau=exp(theta) to preserve positivity, then apply gradient updates to L_train(exp(theta)). Theta=0 gives tau=1; negative theta still gives a positive temperature. We do not need to derive the complete gradient on the slide. The supplied implementation computes it analytically and checks it against finite differences. A finite gradient run seeks a low-loss solution. It does not establish a global minimum, and the best value over positive tau can be approached at a boundary rather than attained at a finite temperature.\n\nValidation observations are absent from this optimization objective. Their error will assess the resulting predictor and inform model choices. A final test remains separate. This makes the narrative distinction precise: learning changes a parameter using the training objective; evaluation asks how well the resulting procedure predicts other observations."},{"act":3,"minutes":4,"title":"Learning the temperature","scene":"training","mode":"train","body":"<p>The memory stays fixed while prediction error adjusts the temperature.<\/p>","note":"Keep this single demonstration in place while making the three visible points. Begin at tau=1 with no updates. Explain a residual as predicted minus observed target; the displayed training loss averages squared residuals over the separate training queries. The memory bank and all observed targets stay fixed.\n\nTake one update and connect the displayed gradient with theta_new = theta_old minus learning_rate times gradient. Then run several updates. Watch the temperature, the prediction curve, and the influence of stored examples change together. These are actual gradient updates using the fixed memory and training queries. Reuse forward, loss, backward, update from the neural-network meeting. The gradient is for the aggregate training objective, so an individual query can prefer a different direction.\n\nReveal Show validation during or after training. The red validation-error curve and validation observations appear without starting a new model or erasing the update count. Hide them again if useful. The prediction curve, query attention encoded by point size, and training-error curve continue to describe the same run. The three teaching points remain visible so the visual change, rather than a new slide title, carries the explanation.\n\nRead training and validation errors with their roles explicit. Training errors supply gradients. Validation errors assess the current predictor without changing its parameters. A lower training loss does not guarantee a lower validation error at every update. Describe what this run actually shows. The later Evaluation section asks whether the procedure works on new queries and whether the comparison is fair; it does not introduce a second way to train the same model.\n\nReset and compare an initial temperature or learning rate only if time permits. Large or tiny initial temperatures can yield small gradients, and this run does not prove convergence to a global optimum. Source for the general training mechanism: PyTorch Automatic Differentiation, https://docs.pytorch.org/tutorials/beginner/basics/autogradqs_tutorial.html.","teachingPoints":[{"title":"Measure error","text":"Predict the training queries using the fixed memory."},{"title":"Update θ","text":"Use the training-loss gradient to change τ = exp(θ)."},{"title":"Evaluate","text":"Check separate validation queries. Their targets never enter the update."}]},{"act":3,"minutes":2,"title":"PyTorch: one trainable scalar","scene":"pytorch","mode":"setup","body":"<p>Store the observations as tensors. Pass only the scalar θ to the optimizer.<\/p>","code":"import torch\n# Loading helper and data are in the full script.\nkeys, values = tensors(data[\"memory\"])\nq_train, t_train = tensors(data[\"train\"])\nq_valid, t_valid = tensors(data[\"valid\"])\ntheta = torch.nn.Parameter(torch.tensor(0.0))\noptimizer = torch.optim.SGD([theta], lr=0.2)","codeTitle":"Set up data and the parameter","codeCaption":"The full script loads the same results.json used by the lecture.","teachingPoints":[{"title":"Fixed observations","text":"40 keys and values; 80 training queries; 160 validation queries."},{"title":"One learned number","text":"theta is a scalar Parameter. Starting at zero gives temperature 1."},{"title":"Only [theta]","text":"The optimizer receives no keys, values, or observed targets."}],"note":"Bridge directly from the live temperature animation to its PyTorch implementation. The full downloadable script uses the exact same fixed synthetic observations as the lecture, loaded from results.json. Its tensors(rows) helper makes one-dimensional tensors of inputs and targets. All data tensors have requires_grad=False. Memory has 40 keys and 40 paired values; training has 80 query/target pairs; validation has another 160. The files are supplied together, so no dataset download is needed.\n\nPoint to torch.nn.Parameter: theta is one scalar leaf parameter. The optimizer receives [theta] explicitly, which is the complete list of learned quantities in this example. Parameter initialization at zero means exp(theta)=1. Memory values participate in predictions but they are not in the optimizer and are not adjusted. No neural-network layer or Module subclass is needed to optimize one differentiable scalar. The full script uses float64 on CPU for a close numerical comparison with the existing reference; this is a reproducibility detail, not a new learning concept. Source: https://docs.pytorch.org/docs/stable/generated/torch.nn.parameter.Parameter.html and https://docs.pytorch.org/docs/stable/generated/torch.optim.SGD.html."},{"act":3,"minutes":2,"title":"PyTorch: predict and measure error","scene":"pytorch","mode":"forward","body":"<p>The attention formula becomes a few tensor operations, all connected to θ.<\/p>","code":"def predict(q):\n    tau = theta.exp()\n    d2 = (q[:, None] - keys[None, :]).square()\n    alpha = torch.softmax(-d2 / tau, dim=1)\n    return alpha @ values\n\npred = predict(q_train)\nloss = (pred - t_train).square().mean()","codeTitle":"Forward pass and training loss","codeCaption":"Rows are queries; columns are stored keys. Normalize each row.","teachingPoints":[{"title":"Positive temperature","text":"Recompute tau from theta inside every forward pass."},{"title":"One row per query","text":"80 queries compare with 40 keys. Softmax normalizes over the keys."},{"title":"One scalar loss","text":"Combine stored values, then average the 80 squared prediction errors."}],"note":"Walk down the code in the same order as the mathematical definition. exp(theta) keeps tau positive and preserves the derivative connection to theta. q[:, None] has shape (80,1), while keys[None,:] has shape (1,40), so broadcasting produces an (80,40) matrix of squared distances. Each row contains the distances for one query. dim=1 in softmax therefore normalizes across stored keys, giving each query its own attention distribution. alpha @ values is an (80,40) matrix times a (40,) vector and returns 80 predictions.\n\nThe mean squared error is one scalar over the separate training targets. PyTorch records the chain from theta through exp, division, softmax, weighted sum, and loss so backward can compute its derivative. Do not call theta.item(), detach(), or torch.tensor(theta) inside predict: that would break the intended gradient path. Do not place this training forward pass inside no_grad. The fixed data need no gradients for theta to receive a gradient. Source: PyTorch Automatic Differentiation, https://docs.pytorch.org/tutorials/beginner/basics/autogradqs_tutorial.html; torch.softmax, https://docs.pytorch.org/docs/stable/generated/torch.softmax.html."},{"act":3,"minutes":2,"title":"PyTorch: backward, step, repeat","scene":"pytorch","mode":"update","body":"<p>Autograd computes the derivative; SGD changes θ. Validation stays outside the update.<\/p>","code":"for step in range(500):\n    optimizer.zero_grad()\n    loss = (predict(q_train) - t_train).square().mean()\n    loss.backward()\n    optimizer.step()\n\nwith torch.no_grad():\n    valid_mse = (predict(q_valid) - t_valid).square().mean()","codeTitle":"Training loop, then evaluation","codeCaption":"Verified output from the supplied PyTorch script on the lecture data.","teachingPoints":[{"title":"Clear, then compute","text":"zero_grad clears old gradients; backward computes the current derivative."},{"title":"Update one parameter","text":"step applies theta ← theta − 0.2 × theta.grad."},{"title":"Evaluate separately","text":"no_grad computes validation predictions without building a gradient graph."}],"walkthrough":[{"title":"Clear and predict","text":"Start with temperature 1. Recompute training loss after clearing the previous gradient.","lines":[2,3],"snapshot":"initial"},{"title":"Differentiate","text":"backward stores dL/dtheta = 0.142798 in theta.grad. It has not changed theta.","lines":[4],"snapshot":"gradient"},{"title":"Take one step","text":"SGD changes theta to -0.028560, so tau becomes 0.971844. Memory stays fixed.","lines":[5],"snapshot":"oneStep"},{"title":"Repeat, then evaluate","text":"After 500 updates, tau is 0.068358. Separate validation MSE is 0.139597.","lines":[1,7,8],"snapshot":"final"}],"note":"Use the walkthrough to connect the code to real output from pytorch-temperature.py, recorded in pytorch-results.json. These displayed checkpoints were executed using PyTorch on CPU with float64, not generated by the browser pretending to run Python. The prior training slide performs the corresponding updates live in JavaScript; this slide explains the actual PyTorch program.\n\nFirst clear gradients: PyTorch accumulates gradients unless they are reset. Recompute a fresh loss at the current theta, then call backward to populate theta.grad. At the initial theta=0, the gradient is 0.14279783879110647 and the training MSE is 0.28187427780057106. backward alone does not change theta. optimizer.step applies theta_new=theta_old-0.2*theta.grad, giving theta=-0.028559567758221296 and tau=0.971844401829539 after one update. The script checks this gradient against a central finite difference.\n\nThe code uses full-batch gradient descent even though PyTorch names the optimizer SGD: each update uses all 80 training queries, with no momentum or weight decay. After the fixed budget of 500 updates, theta=-2.6829986421922136, tau=0.06835786573448518, training MSE=0.12917563875331126, and validation MSE=0.13959742532241623. These agree with the lecture reference to numerical precision.\n\nEvaluation is a separate forward computation on q_valid with t_valid used only to measure its error. no_grad prevents a gradient graph from being recorded; it does not itself change theta or guarantee a fair split, which comes from the data construction. There is no backward or optimizer.step in the evaluation block. No dropout or batch normalization is present, so a Module.eval call is unnecessary here. Source: PyTorch Optimizing Model Parameters, https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial.html."},{"act":3,"minutes":1,"title":"Learned parameters and attention weights","scene":"cards","body":"<p>Learning changes a shared parameter. Prediction computes a new attention distribution for each query.<\/p>","items":[{"title":"Memory","text":"The stored inputs and targets remain available for later predictions."},{"title":"Learned θ","text":"Training updates it across many queries, then inference holds it fixed."},{"title":"Computed αᵢ(q)","text":"The attention weights change when the query changes, even with θ fixed."}],"note":"This distinction deserves a direct check. Ask whether moving the query after training is another training step. It is not: the fixed parameters and new input produce new attention weights as part of inference. The word weights can mean different quantities. Alpha_i(q) are normalized coefficients for this prediction. Theta is the persistent learned parameter controlling how those coefficients are computed. The stored target values are retained observations, not independently optimized coefficients in this model. A model can therefore combine a growing memory with a small fixed number of learned parameters."},{"act":4,"minutes":2,"title":"A query can copy its own target","scene":"copying","mode":"self","defaults":{"excludeSelf":false},"body":"<p>If a memory example queries the same memory, its own key has distance zero and its target is available to retrieve.<\/p>","note":"Transition: learning asked how to choose a temperature by reducing training loss. Evaluation asks whether the resulting rule predicts observations whose answers were unavailable during fitting. The section formerly called Evidence is named Evaluation because its role is to test that claim. Here empirical evidence means the results of those checks, not the values stored in the memory.\n\nDeliberately change the evaluation setup to expose the copying problem. Use the memory rows themselves as queries, leaving each queried row in the memory. Lower the temperature and watch the apparent error shrink. With distinct stored inputs and a unique zero-distance match, the limiting prediction retrieves the row's own target. This is a property of the task setup, not evidence of prediction for new observations. Label the displayed resubstitution error clearly. The main training demonstration avoided this problem by using separate query rows."},{"act":4,"minutes":2,"title":"The query's own answer is removed","scene":"copying","mode":"excluded","defaults":{"excludeSelf":true},"body":"<p>Exclude each query's own memory entry. Its prediction must now use other observations.<\/p>","note":"Toggle self exclusion at the same temperature, then inspect the changed error. Removing the exact same row creates a leave-one-out prediction within training. It does not automatically solve leakage from duplicates, related observations, or future information. For forecasting, the memory must contain only information available before the prediction time. The disjoint memory/train-query design remains the main experiment here. Compare this leave-one-out loss with separate validation only with the labels visible; they are different evaluation sets and not interchangeable estimates by definition."},{"act":4,"minutes":2,"title":"Each set has a different role","scene":"cards","body":"<p>Both the memory bank and the fitting queries belong to training. Validation guides choices about the fitted model.<\/p>","items":[{"title":"Memory and fitting queries","text":"One supplies stored values. The other supplies targets for the training loss."},{"title":"Validation","text":"Evaluates choices without contributing targets to memory or gradients."},{"title":"Final test","text":"Remains separate until the model and evaluation procedure are chosen."}],"note":"Draw the training set as a larger box containing two disjoint roles, rather than suggesting that the memory bank is outside training. Keep preprocessing inside the training procedure as well. If feature scaling is fitted, it must use training information and transform all later queries consistently. This demo uses a controlled synthetic scale and disjoint generated observations. No final-test score appears in the lecture. Repeated decisions based on validation can overfit validation, which is why a final independent test still has a role. Source for the general leakage rule: https://scikit-learn.org/stable/common_pitfalls.html."},{"act":4,"minutes":3,"title":"The same memory, different predictors","scene":"comparison","body":"<p>Compare every method on the same validation queries. Only the rule for combining stored targets changes.<\/p>","note":"Use the displayed computed table. The methods include the memory mean, nearly nearest-neighbor attention at a very small fixed temperature, attention at the initial temperature, and attention after fitting temperature. Keep the same memory and validation rows for all four. Read the actual measured MSE values from the built experiment, with smaller meaning better. The synthetic generator contains a smooth nonlinear signal plus independent target noise; this is a designed teaching task, not evidence of superiority on all regression problems. The separate fitting queries drive the learned temperature. Validation does not drive the gradient. If the result differs under another seed or setting, describe the new measured result honestly."},{"act":4,"minutes":2,"title":"Learning and tuning can choose the same value","scene":"cards","body":"<p>A carefully tuned fixed temperature can match a trained temperature. Training supplies another way to choose the parameter.<\/p>","items":[{"title":"A fixed choice","text":"Use a specified temperature for every query."},{"title":"Validation tuning","text":"Compare candidate temperatures using validation performance."},{"title":"Gradient training","text":"Use training-query errors to update a continuous parameter."}],"note":"Avoid overselling the single learned scalar. For this same memory and formula, a manually chosen or grid-searched temperature equal to the learned temperature produces identical predictions. Learning does not expand this scalar-temperature family. Its conceptual value is that the rule is differentiable and can be fitted together with other parameters. Which procedure works better depends on its objective, data, budget, and initialization. The next experiment adds a parameter that can actually change which keys look relevant, rather than merely changing concentration within a fixed ordering."},{"act":4,"minutes":2,"title":"Reflection: a perfect training score","scene":"reflection","body":"<p>A student lowers the temperature until every stored observation predicts its own target almost perfectly.<\/p><p>What has this demonstrated? Describe a change to the evaluation that would test prediction for other observations.<\/p>","note":"Allow about 90 seconds to write and 30 seconds to discuss. Keep the prompt visible without revealing answers. Expected answer: the model can retrieve known targets when their own keys are present. This demonstrates memorization or resubstitution performance, not generalization. Evaluate disjoint queries whose targets are unavailable to the memory, or exclude the query's own entry during an appropriate training-only leave-one-out calculation and still retain independent validation. A strong answer also notices duplicates or temporal leakage. Do not say memory itself is invalid; the problem is whether the evaluation resembles the intended new-query task."},{"act":5,"minutes":2,"title":"An irrelevant feature can choose the neighbors","scene":"geometry","mode":"manual","defaults":{"theta":0,"phi":0},"body":"<p>In this separate experiment, the target depends on x₁. The unrelated coordinate x₂ can still affect ordinary distance.<\/p>","note":"Clearly announce a new two-dimensional synthetic experiment. Both coordinates use the same numerical range so the problem is relevance, not merely incompatible units. The target generator depends on x1 with noise; x2 is unrelated. With equal feature weights, a point similar in x2 can appear closer than a point with more relevant x1. Ask students to predict which examples ought to matter. Changing temperature alone preserves the distance ordering and cannot remove the irrelevant coordinate's influence on it."},{"act":5,"minutes":2,"title":"Feature weights change what looks close","scene":"geometry","mode":"manual","defaults":{"theta":0,"phi":4},"body":"<p>Give x₁ more weight in the distance. The ordering of relevant examples can now change.<\/p>","note":"Move the feature-weight control while holding temperature fixed. Inspect the distance contours, the selected query's attention, or the ranked stored examples. The new distance emphasizes differences in x1 and discounts differences in x2. The initial state uses phi=4, so rho=sigmoid(phi) is near one, but the exact shown value should come from the computation. Do not tell students that all tasks should favor the first coordinate. In this constructed problem we know the generator; in an actual prediction task, separate evidence is needed. Feature weighting changes the metric, while temperature controls concentration for the current metric."},{"act":5,"minutes":2,"title":"Learning relevance and concentration","scene":"cards","body":"<div class=\"equation\">D² = ρ(q₁ − xᵢ₁)²<br>+ (1 − ρ)(q₂ − xᵢ₂)²<\/div><p>The score becomes −D² / τ.<\/p>","items":[{"title":"Feature relevance","text":"ρ = sigmoid(φ) assigns the two feature weights ρ and 1 − ρ."},{"title":"Attention concentration","text":"τ = exp(θ) controls how sharply distance affects influence."},{"title":"Training","text":"Prediction error can update both φ and θ."}],"note":"Introduce only two learned scalars: theta determines a positive temperature and phi determines rho in (0,1). The feature weights sum to one, separating relative feature importance from the overall distance scale. Without a scale convention, multiplying all feature-distance weights and temperature by the same positive factor leaves attention unchanged. The normalized form removes that simple redundancy. It is still a restricted diagonal metric, not an arbitrary learned representation or a guarantee of finding every useful relationship. The gradient flows through the weighted distance, softmax, weighted targets, and prediction loss."},{"act":5,"minutes":3,"title":"Prediction error learns which feature matters","scene":"geometry","mode":"train","body":"<p>Train temperature alone, then add learned feature relevance. Compare validation error.<\/p>","note":"Begin from the equal-feature initial state. Compare the supplied temperature-only run with the run that fits both parameters on the same memory and training queries. Show parameter updates and the resulting geometry or attention, then inspect the measured validation errors. The target generator depends on x1, so the full model has a useful direction in which to change its metric. Report the actual learned rho and errors in the display. Do not imply that gradient descent must reach exactly rho=1 or that training can eliminate the irreducible target noise. This is the concrete demonstration of stored observations combined with learned weights."},{"act":5,"minutes":1,"title":"A weighted average has limits","scene":"cards","body":"<p>Learned relevance can improve the choice of evidence. The output remains a convex combination of stored values.<\/p>","items":[{"title":"Target range","text":"The prediction stays between the smallest and largest stored target values."},{"title":"Available evidence","text":"Poor coverage or misleading examples can still produce poor predictions."}],"note":"Return to the weights summing to one. No combination of positive normalized weights can produce a scalar prediction beyond the range of the stored targets. Learned temperature and feature weights do not remove that limitation. The model can also behave poorly in sparse regions even if its output remains within range. This is a useful boundary on the claim that memory plus learned weights is powerful: it improves a concrete rule but does not provide arbitrary extrapolation or cure every data problem."},{"act":6,"minutes":2,"title":"New memory can change a prediction","scene":"memory","mode":"add","body":"<p>Hold the learned parameters fixed. Add or remove an example and observe how the prediction changes.<\/p>","note":"Return to a clearly labeled memory-edit demonstration. Keep temperature and any metric parameter fixed while adding or removing one example. The change in prediction comes from the available keys and values, not an optimizer update. Adding a key also changes the softmax denominator and redistributes existing attention shares. A memory update does not guarantee better predictions, and the old validation measurement no longer certifies the changed memory. The lecture's performance table refers to the fixed original memory. This experiment illustrates the source of the change, not a new reported performance result."},{"act":6,"minutes":2,"title":"The same key can carry a different value","scene":"memory","mode":"target","body":"<p>Change one stored target while keeping its input and the model parameters fixed. Its attention weight stays the same.<\/p>","note":"Use the target-value control on one stored example. Since this scoring rule depends on queries, keys, and learned parameters, changing a stored value alone leaves its attention weight unchanged. The prediction changes by alpha_i times the change in that value when the memory membership and all keys stay fixed. Read this relationship from the display using two target settings. This is a controlled thought experiment or a corrected observation, not an instruction to alter labels to improve a score. It cleanly separates information used to choose relevance from information being combined."},{"act":6,"minutes":2,"title":"What fitting retains","scene":"cards","body":"<p>A fitted memory predictor can retain both observed examples and learned parameters.<\/p>","items":[{"title":"Observed examples","text":"Keys and target values supply evidence for later queries."},{"title":"Learned parameters","text":"Temperature and feature weights determine how the predictor uses that evidence."},{"title":"A new prediction","text":"The fixed fitted model computes fresh attention weights for the new query."}],"note":"Compare this retained state with ordinary kNN and the earlier neural-network model. The memory can grow with the number of stored observations even though this example has only one or two learned scalar parameters. Calling a model non-parametric does not forbid every learned parameter; the key distinction here is that its representation includes a data-dependent memory rather than reducing everything to a fixed-size parameter vector. Do not label the model purely parametric because a temperature is trained. At inference, changing attention weights is a forward computation and does not require a loss or gradient."},{"act":6,"minutes":3,"title":"Memory, learning, and prediction","scene":"quiz","body":"<div class=\"task\"><b>Discuss<\/b><p>Explain each answer using the model's computation.<\/p><\/div>","questions":["Does a new query require retraining the temperature?","Can temperature alone reverse the ranking of two fixed-distance keys?","Which observations supply the gradient?","What can learned feature weights change?","Can this weighted average exceed every stored target?"],"answers":["No. Fixed parameters compute new attention weights for the new query.","No. Positive temperature changes concentration while preserving the ranking.","Separate training queries and their targets, using the fixed training memory.","The distances and therefore which keys receive the most attention.","No. Nonnegative weights that sum to one keep it inside the stored target range."],"note":"Invite a justification before each answer. Preserve the distinction between learned parameters and computed attention weights. The main demonstration uses disjoint training memory and fitting queries, with separate validation. A query's new attention distribution requires a forward computation but no retraining. Temperature preserves ranking for a fixed distance rule, while feature weights can change that ranking. The range claim follows from the normalized positive weights, not from the particular synthetic data. If time is short, prioritize the first, third, and fourth questions because they test the meeting's central memory-and-parameters idea."},{"act":6,"minutes":1,"title":"A model can learn how to use memory","scene":"cards","body":"<p>The memory supplies observed values. Learned parameters control how a query combines them.<\/p><div class=\"task\"><b>Explain<\/b><p>Which examples influenced this prediction, and what gave them that influence?<\/p><\/div>","items":[{"title":"The observed evidence","text":"Stored inputs and targets remain part of the fitted model."},{"title":"The learned rule","text":"Temperature controls concentration. Feature weights can change relevance."}],"note":"Close on the actual constructed model. Ask a student to answer the question for a query seen in one of the demonstrations: identify influential observations, connect their weights to distances and parameters, and explain the weighted prediction. Large attention weights describe this model's computation, not a causal claim that the corresponding observation caused the real-world target. The instructor may use this question to connect with later interpretability material, but the student slide makes no scheduling promise. The completed arc is a retained memory with a learned rule for using it."}]};

  if(selectedSlide!==index||!boxData(selected))selected=null;
  textLayer.replaceChildren();
  for(const s of strokes().filter(s=>s.tool==='text')){
   const box=document.createElement('div');box.className='ink-text-box';box.dataset.textId=s.id;applyStyle(box,s);box.append(content(s,true));
   const active=s.id===selected&&['use','text'].includes(mode);box.classList.toggle('is-selected',active);
   box.addEventListener('click',e=>{if(!e.target.closest('button,input,select,textarea')&&['use','text'].includes(mode))beginEdit(s.id);});
   if(active){
    const options=document.createElement('div');options.className='ink-text-options';options.setAttribute('aria-label','Text box controls');
    const move=document.createElement('button');move.type='button';move.className='ink-text-move';move.textContent='⠿ Move';move.title='Drag to move; arrow keys to nudge';move.setAttribute('aria-label','Move text box');attachHandle(move,s.id,'move');
    const size=document.createElement('select');size.setAttribute('aria-label','Text size');for(const n of [20,24,28,32,40,48,56]){const option=document.createElement('option');option.value=n;option.textContent=n;option.selected=n===s.size;size.append(option);}size.onchange=()=>{textSize=Number(size.value);editStyle(s.id,{size:textSize});};
    const color=document.createElement('input');color.type='color';color.value=s.color;color.title='Text color';color.setAttribute('aria-label','Text color');color.onchange=()=>{textColor=color.value;editStyle(s.id,{color:textColor});if(mode==='text')get('ink-color').value=textColor;};
    const del=document.createElement('button');del.type='button';del.textContent='Delete';del.setAttribute('aria-label','Delete text box');del.onclick=()=>remove(s.id);
    options.append(move,size,color,del);box.append(options);
    const resize=document.createElement('button');resize.type='button';resize.className='ink-text-resize';resize.title='Drag to change width; height follows the text';resize.setAttribute('aria-label','Resize text box');attachHandle(resize,s.id,'resize');box.append(resize);
   }
   textLayer.append(box);
  }
 }
 return {
  finish,render:renderText,
  color:()=>selected&&boxData(selected)?boxData(selected).color:textColor,
  setColor(color){textColor=color;if(selected&&selectedSlide===index)editStyle(selected,{color});},
  setMode(next){if(!['use','text'].includes(next))selected=null;layer.classList.toggle('ink-text-mode',next==='text');renderText();},
  add(p){
   finish();const before=strokes(),id='text-'+(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2));
   const s=fit({tool:'text',id,x:p[0],y:p[1],w:360,h:48,text:'',size:textSize,color:textColor});
   ink[index]=[...before,s];beginEdit(id,before);scheduleSave();
  },
  validate(s){
   if(typeof s.id!=='string'||!/^[a-zA-Z0-9_-]{1,80}$/.test(s.id)||typeof s.text!=='string'||s.text.length>5000||!/^#[0-9a-f]{6}$/i.test(s.color)||![20,24,28,32,40,48,56].includes(s.size)||![s.x,s.y,s.w,s.h].every(Number.isFinite)||s.x<0||s.y<0||s.w<140||s.h<48||s.x+s.w>W||s.y+s.h>H)throw Error('Invalid text box.');
   return {tool:'text',id:s.id,x:s.x,y:s.y,w:s.w,h:s.h,text:s.text,size:s.size,color:s.color};
  },
  print(page,i){for(const s of strokes(i).filter(s=>s.tool==='text')){const box=document.createElement('div');box.className='ink-text-print';applyStyle(box,s);box.append(content(s));page.append(box);}}
 };
}

 function validInt(x,lo,hi){return Number.isInteger(x)&&x>=lo&&x<=hi;}
 function cleanStates(raw){
  const result={};if(!raw||typeof raw!=='object'||Array.isArray(raw))return result;
  for(const [key,v] of Object.entries(raw)){
   const i=Number(key);if(!validInt(i,0,DECK.slides.length-1)||!v||typeof v!=='object'||Array.isArray(v))continue;
   const q={};for(const [k,x] of Object.entries(v)){
    if(!/^[a-zA-Z][a-zA-Z0-9]{0,40}$/.test(k)||k==='__proto__'||k==='constructor')continue;
    if(typeof x==='number'&&Number.isFinite(x)&&Math.abs(x)<1e7)q[k]=x;
    if(typeof x==='boolean')q[k]=x;
    if(typeof x==='string'&&x.length<100)q[k]=x;
   }result[i]=q;
  }return result;
 }
 function validatePayload(data){
  if(!data||!(data.version===1||(TEXT_ENABLED&&data.version===2))||data.deck!==fingerprint||!data.slides||typeof data.slides!=='object'||Array.isArray(data.slides))throw Error(`This backup does not match this version of meeting ${DECK.meeting}.`);
  let result={},total=0;
  for(const [key,list] of Object.entries(data.slides)){
   const i=Number(key);if(!validInt(i,0,DECK.slides.length-1)||!Array.isArray(list)||list.length>10000)throw Error('Invalid slide data.');
   const textIds=new Set();result[i]=list.map(s=>{
    if(s?.tool==='text'&&textTools){const box=textTools.validate(s);if(textIds.has(box.id))throw Error('Duplicate text box.');textIds.add(box.id);return box;}
    if(!s||!['pen','highlight'].includes(s.tool)||!/^#[0-9a-f]{6}$/i.test(s.color)||!Number.isFinite(s.width)||s.width<1||s.width>100||!Array.isArray(s.points)||!s.points.length)throw Error('Invalid ink stroke.');
    total+=s.points.length;if(total>1500000)throw Error('The backup contains too many points.');
    const points=s.points.map(p=>{if(!Array.isArray(p)||p.length!==2||!p.every(Number.isFinite)||p[0]<0||p[0]>W||p[1]<0||p[1]>H)throw Error('Invalid ink coordinates.');return [p[0],p[1]];});
    return {tool:s.tool,color:s.color,width:s.width,points};
   });
  }
  return {slides:result,states:cleanStates(data.states)};
 }
 try{let raw=localStorage.getItem(storageKey);
 if(raw){const data=validatePayload(JSON.parse(raw));ink=data.slides;state=data.states;}}
 catch(e){loadedWarning='Browser storage could not be loaded. Use backups for this session.';saveFailed=true;}
 function payload(){return {version:TEXT_ENABLED?2:1,deck:fingerprint,title:`CS 301 · Meeting ${DECK.meeting} · ${DECK.title}`,savedAt:new Date().toISOString(),slides:ink,states:cleanStates(state)};}
 function status(message,failed=false){const e=get('ink-save-status');e.textContent=message;e.dataset.failed=failed;e.title=failed?'Automatic browser saving failed. Download an annotation backup.':`Ink${TEXT_ENABLED?', text,':''} and diagram states are saved in this browser, not in the HTML file.`;}
 function saveNow(){clearTimeout(saveTimer);try{localStorage.setItem(storageKey,JSON.stringify(payload()));saveFailed=false;status('Saved locally');}catch(e){saveFailed=true;status('Use backup',true);}}
 function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,180);}
 function elementForStroke(s){let el;
  if(s.points.length===1){el=document.createElementNS(NS,'circle');el.setAttribute('cx',s.points[0][0]);el.setAttribute('cy',s.points[0][1]);el.setAttribute('r',s.width/2);el.setAttribute('fill',s.color);}
  else{el=document.createElementNS(NS,'path');el.setAttribute('d',s.points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' '));el.setAttribute('fill','none');el.setAttribute('stroke',s.color);el.setAttribute('stroke-width',s.width);el.setAttribute('stroke-linecap','round');el.setAttribute('stroke-linejoin','round');}
  el.setAttribute('opacity',s.tool==='highlight'?'.27':'1');el.setAttribute('class','ink-stroke');return el;
 }
 function drawInk(){raf=0;layer.replaceChildren(...strokes().filter(s=>s.tool!=='text').map(elementForStroke));if(gesture?.stroke&&gesture.slide===index)layer.append(elementForStroke(gesture.stroke));textTools?.render();updateButtons();}
 function requestDraw(){if(!raf)raf=requestAnimationFrame(drawInk);}
 function updateButtons(){get('ink-undo').disabled=!(undo[index]?.length);get('ink-redo').disabled=!(redo[index]?.length);get('ink-clear').disabled=!strokes().length;get('resetAnnotations').disabled=!Object.values(ink).some(list=>list.length);}
 function remember(i,before){(undo[i]||(undo[i]=[])).push(before);if(undo[i].length>100)undo[i].shift();redo[i]=[];}
 function finishGesture(cancel=false){textTools?.finish();if(!gesture)return;const g=gesture;gesture=null;
  if(g.stroke&&!cancel){remember(g.slide,strokes(g.slide));ink[g.slide]=[...strokes(g.slide),g.stroke];}
  if(g.before){if(cancel)ink[g.slide]=g.before;else if(g.erased)remember(g.slide,g.before);}
  if(layer.hasPointerCapture(g.pointerId))layer.releasePointerCapture(g.pointerId);
  drawInk();saveNow();
 }
 function useMode(next){if(next!=='use')stopPlayback();finishGesture();if(toolbar.contains(document.activeElement))document.activeElement.blur();mode=next;layer.classList.toggle('ink-enabled',mode!=='use');for(const name of ['use','pen','highlight','erase',...(TEXT_ENABLED?['text']:[])])get('ink-'+name).setAttribute('aria-pressed',name===mode);
  get('ink-color').disabled=!['pen','highlight','text'].includes(mode);get('ink-width').disabled=false;get('ink-color').value=mode==='text'?textTools.color():colorsForTool[mode]||colorsForTool.pen;textTools?.setMode(mode);updateInkChoices();
 }
 function undoInk(){finishGesture();if(!undo[index]?.length)return;(redo[index]||(redo[index]=[])).push(strokes());ink[index]=undo[index].pop();drawInk();saveNow();}
 function redoInk(){finishGesture();if(!redo[index]?.length)return;(undo[index]||(undo[index]=[])).push(strokes());ink[index]=redo[index].pop();drawInk();saveNow();}
 function point(e){const r=layer.getBoundingClientRect();return [Math.round(Math.max(0,Math.min(W,(e.clientX-r.left)*W/r.width))*10)/10,Math.round(Math.max(0,Math.min(H,(e.clientY-r.top)*H/r.height))*10)/10];}
 function pointSegment(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],len=dx*dx+dy*dy,t=len?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/len)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
 function segmentsDistance(a,b,c,d){const cross=(u,v,w)=>(v[0]-u[0])*(w[1]-u[1])-(v[1]-u[1])*(w[0]-u[0]);let x=cross(a,b,c),y=cross(a,b,d),z=cross(c,d,a),w=cross(c,d,b);
  if(((x>0&&y<0)||(x<0&&y>0))&&((z>0&&w<0)||(z<0&&w>0)))return 0;
  return Math.min(pointSegment(a,c,d),pointSegment(b,c,d),pointSegment(c,a,b),pointSegment(d,a,b));
 }
 function eraseBetween(a,b){const g=gesture;if(!g)return;const before=strokes(g.slide);ink[g.slide]=before.filter(s=>{if(s.tool==='text')return true;const radius=10+s.width/2;if(s.points.length===1)return pointSegment(s.points[0],a,b)>radius;for(let j=1;j<s.points.length;j++)if(segmentsDistance(a,b,s.points[j-1],s.points[j])<=radius)return false;return true;});if(ink[g.slide].length!==before.length)g.erased=true;requestDraw();}
 layer.addEventListener('pointerdown',e=>{if(mode==='use'||gesture||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();const p=point(e),eraser=mode==='erase'||e.button===5;
  if(mode==='text'){textTools.add(p);return;}
  gesture={slide:index,pointerId:e.pointerId,last:p};layer.setPointerCapture(e.pointerId);
  if(eraser){gesture.before=strokes();gesture.erased=false;eraseBetween(p,p);}else gesture.stroke={tool:mode,color:colorsForTool[mode],width:mode==='highlight'?width*6:width,points:[p]};requestDraw();
 });
 layer.addEventListener('pointermove',e=>{if(!gesture||e.pointerId!==gesture.pointerId)return;e.preventDefault();const samples=e.getCoalescedEvents?.()||[],events=samples.length?samples:[e];
  for(const sample of events){const p=point(sample);if(gesture.before)eraseBetween(gesture.last,p);else if(Math.hypot(p[0]-gesture.last[0],p[1]-gesture.last[1])>.5)gesture.stroke.points.push(p);gesture.last=p;}requestDraw();
 });
 layer.addEventListener('pointerup',e=>{if(!gesture||e.pointerId!==gesture.pointerId)return;e.preventDefault();const p=point(e);if(gesture.before)eraseBetween(gesture.last,p);else if(Math.hypot(p[0]-gesture.last[0],p[1]-gesture.last[1])>.5)gesture.stroke.points.push(p);finishGesture();});
 layer.addEventListener('pointercancel',e=>{if(gesture?.pointerId===e.pointerId)finishGesture(true);});
 layer.addEventListener('lostpointercapture',e=>{if(gesture?.pointerId===e.pointerId)finishGesture();});
 for(const name of ['use','pen','highlight','erase'])get('ink-'+name).onclick=()=>useMode(name);
 if(TEXT_ENABLED){get('ink-text').onclick=()=>useMode('text');for(const [id,label] of [['ink-undo','Undo annotation on this slide (Ctrl+Z)'],['ink-redo','Redo annotation on this slide (Ctrl+Shift+Z)'],['ink-clear','Clear ink and text on this slide (undo available)'],['ink-more','Annotation backup, printing, and help'],['ink-color','Annotation color']]){get(id).title=label;get(id).setAttribute('aria-label',label);}}
 get('ink-undo').onclick=undoInk;get('ink-redo').onclick=redoInk;
 get('ink-clear').onclick=()=>{finishGesture();if(!strokes().length)return;remember(index,strokes());ink[index]=[];drawInk();saveNow();};
 get('ink-color').oninput=e=>{if(mode==='text')textTools.setColor(e.target.value);else if(['pen','highlight'].includes(mode))colorsForTool[mode]=e.target.value;};
  // Keep the original color input for compatibility with text-box editing.
 // Show the palette for the active writing tool; keep width compact and usable.
 get('ink-color').insertAdjacentHTML('beforebegin',
  '<div class="ink-swatches" data-palette="ink" role="group" aria-label="Ink color">'+
  [['Blue','#1565c0'],['Red','#c62828'],['Black','#111111']].map(([name,color])=>
   `<button type="button" class="ink-swatch" data-ink-color="${color}" title="${name} ink" aria-label="${name} ink" aria-pressed="false"><span style="background:${color}"></span></button>`).join('')+'</div>'+
  '<div class="ink-swatches" data-palette="highlight" role="group" aria-label="Highlighter color" hidden>'+
  [['Yellow','#fdd835'],['Orange','#fb8c00']].map(([name,color])=>
   `<button type="button" class="ink-swatch" data-ink-color="${color}" title="${name} highlighter" aria-label="${name} highlighter" aria-pressed="false"><span style="background:${color}"></span></button>`).join('')+'</div>');
 get('ink-width').insertAdjacentHTML('beforebegin','<label class="ink-width-label" for="ink-width">Width</label>');
 get('ink-width').innerHTML=[[3,'Thin'],[5,'Medium'],[8,'Thick']].map(([n,name])=>`<option value="${n}">${name}</option>`).join('');
 function updateInkChoices(){
  const color=mode==='text'?textTools.color():(colorsForTool[mode]||colorsForTool.pen);
  toolbar.querySelectorAll('[data-palette]').forEach(group=>group.hidden=group.dataset.palette!==(mode==='highlight'?'highlight':'ink'));
  toolbar.querySelectorAll('[data-ink-color]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.inkColor===color));
  get('ink-width').value=String(width);
 }
 function chooseInkColor(color){
  if(!['pen','highlight','text'].includes(mode))useMode('pen');
  if(mode==='text')textTools.setColor(color);else colorsForTool[mode]=color;
  get('ink-color').value=color;
  updateInkChoices();
 }
 toolbar.querySelectorAll('[data-ink-color]').forEach(button=>button.onclick=()=>chooseInkColor(button.dataset.inkColor));
 get('ink-color').oninput=e=>chooseInkColor(e.target.value);
 get('ink-width').onchange=e=>{finishGesture();width=Number(e.target.value);useMode(mode==='highlight'?'highlight':'pen');};

 get('ink-menu').querySelector('#ink-close').onclick=()=>menu.close();
 const menuButton=get('ink-more');
 menuButton.onclick=()=>{finishGesture();get('ink-menu-message').textContent=saveFailed?'Browser saving is unavailable. Download a backup to keep your annotations.':`Backups include ink${TEXT_ENABLED?', text,':''} and diagram states for all slides.`;get('ink-menu-message').dataset.failed=saveFailed;menu.showModal();};
 get('ink-export').onclick=()=>{finishGesture();const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`meeting-${DECK.meeting}-ink${TEXT_ENABLED?'-text':''}-backup.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);get('ink-menu-message').textContent='Annotation backup downloaded.';get('ink-menu-message').dataset.failed=false;};
 get('ink-load').onclick=()=>{fileInput.value='';fileInput.click();};
 fileInput.onchange=async()=>{const f=fileInput.files[0];if(!f)return;try{if(f.size>40000000)throw Error('The backup file is too large.');const loaded=validatePayload(JSON.parse(await f.text()));finishGesture();stopPlayback();for(let i=0;i<DECK.slides.length;i++)remember(i,strokes(i));ink=loaded.slides;state=loaded.states;render();saveNow();get('ink-menu-message').textContent='Backup loaded. Previous ink is available with Undo on each slide.';get('ink-menu-message').dataset.failed=false;}catch(e){get('ink-menu-message').textContent='Could not load backup: '+e.message;get('ink-menu-message').dataset.failed=true;}};
 get('ink-print').onclick=()=>{finishGesture();menu.close();window.print();};
 // Run before the original keyboard listener, without changing its navigation keys.
 document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||e.target.closest('input,select,textarea')||e.altKey)return;const key=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&key==='z'){e.preventDefault();e.stopImmediatePropagation();e.shiftKey?redoInk():undoInk();return;}
  if((e.ctrlKey||e.metaKey)&&key==='y'){e.preventDefault();e.stopImmediatePropagation();redoInk();return;}
  if(e.ctrlKey||e.metaKey)return;const map={v:'use',p:'pen',h:'highlight',e:'erase',...(TEXT_ENABLED?{t:'text'}:{})};if(map[key]){e.preventDefault();e.stopImmediatePropagation();useMode(map[key]);}
 },true);
 const baseRender=render;
 render=function(){finishGesture();baseRender();document.title+=TEXT_ENABLED?' · Ink + text copy':' · Ink copy';drawInk();scheduleSave();};
 // The base print listener runs first; replace its reflowed pages with exact-layout pages.
 addEventListener('beforeprint',()=>{finishGesture();stopPlayback();const old=index,container=get('print');container.replaceChildren();
  DECK.slides.forEach((s,i)=>{index=i;const page=document.createElement('section');page.className='ink-print-page';
   page.innerHTML=`<article class="ink-print-slide ${slideClass(s)}">${slideContent(s,st())}</article><footer class="footer"><span>${DECK.title}</span><span>${i+1} / ${DECK.slides.length}</span></footer>`;
   const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('class','ink-print-svg');strokes(i).filter(s=>s.tool!=='text').forEach(s=>svg.append(elementForStroke(s)));page.append(svg);textTools?.print(page,i);container.append(page);
  });index=old;
 });
 addEventListener('pagehide',()=>{finishGesture();saveNow();});
 addEventListener('blur',()=>finishGesture());
 get('restartLecture').onclick=()=>{
  useMode('use');stopPlayback();state={};go(0);saveNow();
  status('Lecture reset');get('restartLecture').blur();
 };
 get('resetAnnotations').onclick=()=>{
  useMode('use');
  for(const [key,list] of Object.entries(ink))if(list.length)remember(Number(key),list);
  ink={};drawInk();saveNow();
  status('Annotations reset');get('resetAnnotations').blur();
 };

 useMode('use');baseRender();document.title+=TEXT_ENABLED?' · Ink + text copy':' · Ink copy';drawInk();
 if(loadedWarning)status('Use backup',true);else status(Object.keys(ink).length?(TEXT_ENABLED?'Notes restored':'Ink restored'):'Ready');
})();

</script></body></html>
